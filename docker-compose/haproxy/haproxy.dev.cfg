# HAProxy configuration for Simulation Engine
# Load balanced simulation processing

global
    maxconn 10000
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option forwardfor except 127.0.0.0/8
    option redispatch
    retries 3

    # Timeouts for long-running simulations (750+ buildings, unlimited time)
    timeout connect 10s
    timeout client 24h
    timeout server 24h
    timeout queue 24h
    timeout http-request 24h
    timeout http-keep-alive 30s

# Stats dashboard - accessible at :8405/stats
frontend stats
    bind *:8405
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST
    stats show-legends

# Main frontend for simulation requests
frontend simulation_frontend
    bind *:8089

    # Route /api/webservices to webservice microservice
    acl is_webservice path_beg /api/webservices
    use_backend webservice_backend if is_webservice

    default_backend simulation_backend

# Backend pool of simulation engine instances
backend simulation_backend

    # Health check on /health endpoint
    option httpchk GET /health
    http-check expect status 200

    # Slow start for recovered instances
    default-server inter 10s fall 3 rise 2 slowstart 120s

    # Backend servers - maxconn matches MAX_CONCURRENT_SIMS (2)
    # When a server is at capacity, new requests go to the next available
    server sim-1 s6et-webservice-1:8081 check weight 100 maxconn 2

    # Connection reuse
    http-reuse safe

# Backend for webservice microservice (manages simulation instances)
backend webservice_backend

    option httpchk GET /health
    http-check expect status 200

    default-server inter 5s fall 3 rise 2

    # Webservice microservice on platform-core VM
    server webservice-1 webservice:8082 check weight 100 maxconn 50

    http-reuse safe
