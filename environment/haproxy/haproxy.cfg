# HAProxy configuration for Simulation Engine
# Load balanced simulation processing

global
    maxconn 10000
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option forwardfor except 127.0.0.0/8
    option redispatch
    retries 3
    
    # Timeouts for long-running simulations (750+ buildings, unlimited time)
    timeout connect 10s
    timeout client 24h
    timeout server 24h
    timeout queue 24h
    timeout http-request 24h
    timeout http-keep-alive 30s

# Stats dashboard - accessible at :8405/stats
frontend stats
    bind *:8405
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST
    stats show-legends

# Main frontend for simulation requests
frontend simulation_frontend
    bind *:8089
    
    # Rate limiting - 20 requests per second per IP (simulations are heavy)
    stick-table type ip size 10k expire 60s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 20 }
    
    # Route /api/webservices to webservice microservice
    acl is_webservice path_beg /api/webservices
    use_backend webservice_backend if is_webservice
    
    default_backend simulation_backend

# Backend pool of simulation engine instances
backend simulation_backend
    balance leastconn

    # Health check on /health endpoint
    option httpchk GET /health
    http-check expect status 200

    # Queue settings - important for simulation bursts
    timeout queue 300s

    # Retry on another server if the chosen one is unavailable or at capacity
    option redispatch
    retries 3
    retry-on conn-failure empty-response response-timeout 503

    # Slow start for recovered instances
    default-server inter 10s fall 3 rise 2 slowstart 120s

    # Backend servers - maxconn matches MAX_CONCURRENT_SIMS (5)
    # When a server is at capacity, new requests go to the next available
    server sim-1 enerplanet-webservice-1:8081 check weight 100 maxconn 5
    server sim-2 enerplanet-webservice-2:8081 check weight 100 maxconn 5
    server sim-3 enerplanet-webservice-3:8081 check weight 100 maxconn 5
    server sim-4 enerplanet-webservice-4:8081 check weight 100 maxconn 5
    server sim-5 enerplanet-webservice-5:8081 check weight 100 maxconn 5

    # Connection reuse
    http-reuse safe

# Backend for webservice microservice (manages simulation instances)
backend webservice_backend
    balance roundrobin
    
    option httpchk GET /health
    http-check expect status 200
    
    default-server inter 5s fall 3 rise 2
    
    # Webservice microservice on platform-core VM
    server webservice-1 10.1.66.39:8082 check weight 100 maxconn 50
    
    http-reuse safe
