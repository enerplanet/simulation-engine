services:
    # HAProxy Load Balancer for simulation engine
    sim_haproxy:
        image: haproxy:2.9-alpine
        container_name: enerplanet-sim-haproxy
        ports:
            - 8089:8089/tcp
            - 8405:8405/tcp  # Stats dashboard
        volumes:
            - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
        depends_on:
            - webservice_1
            - webservice_2
            - webservice_3
            - webservice_4
            - webservice_5
        networks:
            enerplanet_sim_network:
                ipv4_address: 172.20.0.10
            spatialhub-net:
        restart: always

    # Simulation engine instance 1
    webservice_1:
        image: webservice
        container_name: enerplanet-webservice-1
        volumes:
            - enerplanet_sim_shared_data:/webservice/data
        platform: linux/amd64
        build:
            context: ../engine/
            dockerfile: ../environment/gateway/webservice.dockerfile
        restart: always
        expose:
            - "8081"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            - SERVER_HOST=0.0.0.0
            - SERVER_PORT=8081
            - REQUEST_TIMEOUT=0
            - RETRY_ATTEMPTS=0
            - RETRY_BASE_DELAY=1000
            - MAX_CONCURRENT_SIMS=5
            - PV_SERVICE_HOST=172.20.0.3
            - PV_SERVICE_PORT=8082
            - BUEM_SERVICE_HOST=172.20.0.7
            - BUEM_SERVICE_PORT=5000
            - BUEM_DATA_DIR=/webservice/data/buem
            - BUEM_RESULTS_DIR=/webservice/data
            - IGNIS_SERVICE_HOST=172.20.0.8
            - IGNIS_SERVICE_PORT=8090
            - CALLBACK_HOST=host.docker.internal
            - CALLBACK_PORT=3001
        deploy:
            resources:
                limits:
                    cpus: '6'
                    memory: 48G
                reservations:
                    cpus: '4'
                    memory: 8G
        networks:
            enerplanet_sim_network:
                ipv4_address: 172.20.0.21
            spatialhub-net:

