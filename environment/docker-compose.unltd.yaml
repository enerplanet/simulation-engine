  enerplanet_sim_shared_data:
    external: true
  enerplanet_ignis_db_data:

networks:
    enerplanet_sim_network:
        driver: bridge
        ipam:
            driver: default
            config:
                - subnet: 172.20.0.0/16
                  gateway: 172.20.0.1
    spatialhub-net:
        external: true
