volumes:
  enerplanet_sim_shared_data:
    external: true

networks:
    # Created once by `make up` (docker network create) so this file and
    # building-model/docker-compose.building-model.yaml attach to the same
    # network — webservice_N reaches buem/ignis by static IP across the
    # two compose stacks.
    enerplanet_sim_network:
        external: true
    spatialhub-net:
        external: true
